<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}BarOS{% endblock %}</title><link rel="stylesheet" href="/static/app.css"></head><body>
<div class="shell"><div class="nav"><div class="row"><div class="brand">BAROS</div><span class="badge">server 0.5</span></div>{% if user %}<div class="row">{% if request.cookies.get('baros_platform_session') %}<form action="/platform/exit" method="post"><button class="btn secondary" type="submit">← Все заведения</button></form>{% elif user.role == 'platform_owner' %}<a class="btn secondary" href="/platform">Панель владельца</a>{% endif %}<span class="muted small">{{ user.name }}</span><form action="/logout" method="post"><button class="btn secondary" type="submit">Выйти</button></form></div>{% endif %}</div>{% block content %}{% endblock %}</div><script src="/static/app.js"></script>{% block scripts %}{% endblock %}</body></html>
