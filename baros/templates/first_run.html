{% extends "base.html" %}{% block content %}<div class="auth"><div class="logo-big">BAROS</div><p class="muted">Первый запуск. Создаём владельца и заведение.</p><div class="card"><form method="post"><input type="hidden" name="setup_token" value="{{ setup_token or '' }}"><div class="field"><label>Название заведения</label><input name="venue" required placeholder="Например, Настойка"></div><div class="field"><label>Ваше имя</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Пароль</label><input name="password" type="password" minlength="8" required></div><button class="btn">Создать BarOS</button></form></div></div>{% endblock %}
