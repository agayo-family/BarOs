name: BarOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/baros-ci.db
      FIRST_RUN_TOKEN: ci
      SESSION_SECRET: ci-secret-not-for-production
      BAROS_AI_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q baros
      - name: Verify access, learning, drafts, analytics and data preservation
        run: python -m unittest discover -s tests -v
      - run: python -c "from baros.main import app; print(app.title)"
      - run: python -c "from baros.v2 import ai; s=ai.status(); assert s['model']==ai.FREE_PRIMARY; assert s['mode']=='offline'; print(s)"
      - run: python -c "from baros.main import app; p={r.path for r in app.routes}; required={'/health','/api/auth/login','/api/auth/setup','/api/courses','/api/learning','/api/exams/{eid}','/api/sources','/api/jobs','/api/shifts','/api/shifts/context','/api/shifts/rotations','/api/games','/api/games/runs/{rid}','/api/growth','/api/growth/avatar','/api/ai/usage','/api/ai/spend','/api/mentor','/api/mentor/messages'}; assert required <= p, (required-p); print('routes ok')"
      - name: Validate all browser JavaScript modules
        run: |
          for file in baros/static/v2/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Verify real API and DOM learning, game and shift flows
        run: |
          npm ci --prefix tests/ui --ignore-scripts
          python tests/ui/run.py
      - name: Check known dependency advisories
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baros
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: baros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BAROS_POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://baros:disposable-ci-password@127.0.0.1:5432/baros_test
      DATABASE_URL: postgresql+psycopg://baros:disposable-ci-password@127.0.0.1:5432/baros_test
      BAROS_WORKER: '0'
      COOKIE_SECURE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
      - run: pip install -r requirements.txt
      - name: Verify PostgreSQL locks, last seat and duplicate-login rollback
        run: python tests/postgres_audit.py
      - name: Verify source changes and safe publication on PostgreSQL
        run: |
          BAROS_AI_ENABLED=1 python -m unittest discover -s tests -p 'test_release_readiness.py' -v
          python -m unittest discover -s tests -p 'test_review_workspace.py' -v
          python -m unittest discover -s tests -p 'test_analytics.py' -v
          python -m unittest discover -s tests -p 'test_catalog.py' -v
          python -m unittest discover -s tests -p 'test_catalog_upgrades.py' -v
          python -m unittest discover -s tests -p 'test_catalog_editor.py' -v
      - name: Verify full backup and restore into a separate empty database
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          python tests/backup_restore_audit.py

  browser:
    strategy:
      fail-fast: false
      matrix:
        audit: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - run: npm install --prefix tests/ui --no-save --ignore-scripts playwright@1.62.1
      - run: ./tests/ui/node_modules/.bin/playwright install --with-deps chromium
      - name: Audit all role screens at four widths in both themes
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/tests/ui/node_modules
          BAROS_AUDIT_REVERSE: ${{ matrix.audit == 2 && '1' || '' }}
        run: python tests/browser_audit.py

      - name: Retain audit results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-${{ matrix.audit }}
          path: |
            test-results/browser/result.json
            test-results/browser/progress.json
            test-results/browser/server.log
            test-results/browser/manager-reports*.png
            test-results/browser/manager-drafts-*.png
            test-results/browser/manager-empty-test-editor-*.png
          retention-days: 1
