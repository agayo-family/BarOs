name: BarOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/baros-ci.db
      FIRST_RUN_TOKEN: ci
      SESSION_SECRET: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q baros
      - name: Verify access, learning, games, shifts, AI mentor and data preservation
        run: python -m unittest discover -s tests -v
      - run: python -c "from baros.main import app; print(app.title)"
      - run: python -c "from baros.v2 import ai; s=ai.status(); assert s['model']==ai.FREE_PRIMARY; assert s['mode']=='offline'; print(s)"
      - run: python -c "from baros.main import app; p={r.path for r in app.routes}; required={'/health','/api/auth/login','/api/auth/setup','/api/courses','/api/learning','/api/exams/{eid}','/api/sources','/api/jobs','/api/shifts','/api/shifts/context','/api/shifts/rotations','/api/games','/api/games/runs/{rid}','/api/growth','/api/growth/avatar','/api/ai/usage','/api/ai/spend','/api/mentor','/api/mentor/messages'}; assert required <= p, (required-p); print('routes ok')"
      - name: Validate all browser JavaScript modules
        run: |
          for file in baros/static/v2/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Verify real API and DOM learning, game and shift flows
        run: |
          npm ci --prefix tests/ui --ignore-scripts
          python tests/ui/run.py
