name: BarOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/baros-ci.db
      FIRST_RUN_TOKEN: ci
      SESSION_SECRET: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q baros
      - name: Verify owner recovery security and data preservation
        run: python -m unittest discover -s tests -v
      - run: python -c "from baros.main import app; print(app.title)"
      - run: python -c "from baros.v2 import ai; s=ai.status(); assert s['model']=='openrouter/free'; assert s['mode']=='offline'; print(s)"
      - run: python -c "from baros.main import app; p={r.path for r in app.routes}; required={'/health','/api/auth/login','/api/auth/setup','/api/courses','/api/learning','/api/exams/{eid}','/api/sources','/api/jobs'}; assert required <= p, (required-p); print('routes ok')"
      - name: Validate all browser JavaScript modules
        run: |
          for file in baros/static/v2/*.js; do
            node --input-type=module --check < "$file"
          done
