name: BarOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/baros-ci.db
      FIRST_RUN_TOKEN: ci
      SESSION_SECRET: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q baros
      - run: python -c "from baros.main import app; print(app.title)"
