services:
  - type: web
    name: baros-staging
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: COOKIE_SECURE
        value: "1"
      - key: UPLOAD_DIR
        value: /tmp/baros_uploads
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: DEFAULT_STORAGE_LIMIT_MB
        value: "200"
      - key: AI_PROVIDER
        value: auto
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: AI_DAILY_LIMIT
        value: "5"
      - key: AI_GLOBAL_DAILY_LIMIT
        value: "20"
      - key: AI_PROVIDER_DAILY_CALL_LIMIT
        value: "20"
      - key: AI_ALLOW_PAID_FALLBACK
        value: "0"
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AI_GATEWAY_BASE_URL
        value: https://ai-gateway.vercel.sh/v1
      - key: AI_MODEL
        value: openai/gpt-5.6-sol
      - key: VAPID_SUBJECT
        value: https://baros-staging.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: FIRST_RUN_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: baros-staging-db
          property: connectionString

databases:
  - name: baros-staging-db
    plan: free
