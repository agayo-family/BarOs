services:
  - type: web
    name: baros-staging
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: UPLOAD_DIR
        value: /tmp/baros_uploads
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: SESSION_SECRET
        generateValue: true
      - key: FIRST_RUN_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: baros-staging-db
          property: connectionString

databases:
  - name: baros-staging-db
    plan: free
